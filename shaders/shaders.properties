# Larkmere — Iris shader profile for Minecraft 1.21.11
# Opaque gbuffers fill colortex0 (albedo), colortex1 (normal), colortex2 (light and material).
# deferred lights that image and copies it to colortex5 for water.
# composite adds volumetric shafts. composite1-3 build a half-res bloom.
# final grades, blooms, and tonemaps to the screen.

particles.ordering=mixed
separateEntityDraws=true
shadowTranslucent=false
backFace.translucent=false

colortex0Format=RGBA16F
colortex1Format=RGBA16
colortex2Format=RGBA8
colortex3Format=RGBA16F
colortex4Format=RGBA16F
colortex5Format=RGBA16F

size.buffer.colortex3=0.5 0.5
size.buffer.colortex4=0.5 0.5

blend.gbuffers_terrain=off
blend.gbuffers_terrain.colortex1=off
blend.gbuffers_terrain.colortex2=off
blend.gbuffers_entities=off
blend.gbuffers_entities.colortex1=off
blend.gbuffers_entities.colortex2=off
blend.gbuffers_block=off
blend.gbuffers_block.colortex1=off
blend.gbuffers_block.colortex2=off
blend.gbuffers_particles=off
blend.gbuffers_particles.colortex1=off
blend.gbuffers_particles.colortex2=off
blend.gbuffers_textured_lit=off
blend.gbuffers_textured_lit.colortex1=off
blend.gbuffers_textured_lit.colortex2=off
blend.gbuffers_hand=off
blend.gbuffers_water=off
blend.gbuffers_clouds=off
blend.gbuffers_clouds.colortex2=off
blend.gbuffers_skybasic=off
blend.gbuffers_skytextured=off
blend.gbuffers_basic=off
blend.gbuffers_basic.colortex2=off
blend.gbuffers_lightning=off
blend.gbuffers_lightning.colortex2=off
blend.gbuffers_beaconbeam=off
blend.gbuffers_beaconbeam.colortex2=off
blend.gbuffers_spidereyes=off
blend.gbuffers_spidereyes.colortex2=off

blend.gbuffers_textured.colortex0=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_textured.colortex2=off
blend.gbuffers_damagedblock=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_armor_glint=SRC_ALPHA ONE ONE ONE
blend.gbuffers_weather=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_hand_water=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_entities_translucent=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_block_translucent=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA
blend.gbuffers_particles_translucent=SRC_ALPHA ONE_MINUS_SRC_ALPHA ONE ONE_MINUS_SRC_ALPHA

program.composite.enabled=VOLUMETRIC_LIGHT

screen=<profile> shadowMapResolution SHADOW_SOFTNESS VOLUMETRIC_LIGHT VOL_STEPS BLOOM_STRENGTH FOG_DENSITY
screen.columns=2
sliders=shadowMapResolution SHADOW_SOFTNESS VOL_STEPS BLOOM_STRENGTH FOG_DENSITY

profile.Fast=!VOLUMETRIC_LIGHT shadowMapResolution=1024 SHADOW_SOFTNESS=0.50 VOL_STEPS=6 BLOOM_STRENGTH=0.15 FOG_DENSITY=0.70
profile.Balanced=VOLUMETRIC_LIGHT shadowMapResolution=2048 SHADOW_SOFTNESS=1.00 VOL_STEPS=12 BLOOM_STRENGTH=0.35 FOG_DENSITY=1.00
profile.Cinematic=VOLUMETRIC_LIGHT shadowMapResolution=4096 SHADOW_SOFTNESS=1.60 VOL_STEPS=24 BLOOM_STRENGTH=0.55 FOG_DENSITY=1.40
